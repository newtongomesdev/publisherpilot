services:
  # App principal (Next.js)
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/data.db
      - CHROMADB_URL=http://chromadb:8000
      - RENDERER_URL=http://renderer:3003
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - app-data:/app/data
    depends_on:
      - searxng
      - chromadb
      - renderer

  # SearXNG - Metasearch para busca de imagens
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng:ro

  # ChromaDB - Banco vetorial para busca semântica
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
      - IS_PERSISTENT=True
      - PERSIST_DIRECTORY=/chroma/chroma

  # Renderer - Puppeteer para renderizar slides em PNG
  renderer:
    build: ./scripts/renderer
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003

volumes:
  app-data:
  chroma-data:
