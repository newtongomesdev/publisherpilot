services:
  # App principal (Next.js)
  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file: .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      chromadb:
        condition: service_healthy
      searxng:
        condition: service_healthy

  # Renderiza slides HTML → PNG via Puppeteer
  renderer:
    build: ./scripts/renderer
    ports:
      - "3003:3003"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003

  # SearXNG - Metasearch para busca de imagens
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ChromaDB - Banco vetorial para busca semântica de artigos
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    environment:
      - ANONYMIZED_TELEMETRY=False
      - IS_PERSISTENT=True
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chroma-data:
